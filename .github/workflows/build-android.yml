name: Build Android APK

# 推送（main / master）时自动构建安卓版；也可在 Actions 页手动触发。
# 每次触发都会先把小版本号（patch）+1 并提交回仓库，再构建带签名的 APK。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION="$(node scripts/bump-version.mjs)"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "已递增版本号 -> $NEW_VERSION"

      - name: Commit version bump
        # GITHUB_TOKEN 的 push 不会再次触发 workflow，配合 [skip ci] 双保险
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 4 个 Android ABI，用于构建 universal APK
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npm run tauri android init

      - name: Assert MANAGE_EXTERNAL_STORAGE merged
        # 本地插件自带 manifest 声明，init 时应自动合并进应用 manifest；失败即停
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q "MANAGE_EXTERNAL_STORAGE" "$MANIFEST" && echo "权限已合并" || (echo "::error::MANAGE_EXTERNAL_STORAGE 未合并进 AndroidManifest" && exit 1)

      - name: Generate app icons into Android project
        # 先预处理 Android 前景图（缩放居中 + 透明边距，避免图标过大），
        # 再用 manifest 生成；tauri icon 在 gen/android 已存在时会把图标
        # 直接写入 gen/android/app/src/main/res/（init 模板自带默认图标，必须覆盖）
        run: |
          node scripts/prepare-android-icon.mjs
          npm run tauri icon app-icon.json

      - name: Setup Android signing
        # 从 GitHub Secrets 恢复 keystore 与密码，写入官方约定的 keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_* Secrets，将构建未签名 APK"
            exit 0
          fi
          cd src-tauri/gen/android
          echo "keyAlias=${KEY_ALIAS:-upload}" > keystore.properties
          echo "password=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          echo "storeFile=$RUNNER_TEMP/keystore.p12" >> keystore.properties
          cd "$GITHUB_WORKSPACE"
          python3 scripts/inject-android-signing.py
          echo "签名配置完成"

      - name: Build Android APKs (split per ABI)
        # --split-per-abi：为 arm64-v8a / armeabi-v7a / x86 / x86_64 各产出一个独立 APK
        run: npm run tauri android build -- --apk --split-per-abi

      - name: Collect APKs with ABI names
        # 输出目录结构：apk/<abi>/release/*.apk（abi = aarch64/armv7/i686/x86_64）
        run: |
          mkdir -p apks
          for f in src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            abi=$(basename "$(dirname "$(dirname "$f")")")
            cp "$f" "apks/open-calendar-mobile-${abi}-v${{ steps.bump.outputs.new_version }}.apk"
          done
          ls -la apks/
          test "$(ls apks/*.apk 2>/dev/null | wc -l)" -ge 1

      - name: Tag release version
        # tag push 不匹配 branches 过滤器，不会重复触发本 workflow；已存在则跳过
        run: |
          git tag "v${{ steps.bump.outputs.new_version }}" || echo "tag 已存在"
          git push origin "v${{ steps.bump.outputs.new_version }}" || echo "tag 已推送"

      - name: Create GitHub Release with APKs
        # Release 资产直接下载原始 .apk 文件（Artifact 下载才是 zip，故不用它）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: OpenCalendar v${{ steps.bump.outputs.new_version }}
          body: |
            ## OpenCalendar v${{ steps.bump.outputs.new_version }}

            推送自动构建，按架构拆分 APK（文件名含 ABI 标识）。

            手机一般选 **arm64-v8a**（64 位，主流）；老设备选 **armeabi-v7a**；模拟器选 x86_64 / x86。
            下载对应你设备的 APK 直接安装。
          files: apks/*.apk
          fail_on_unmatched_files: true
